name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test ./... -v -race -count=1

      - name: Build Binary
        run: go build -o devstack.exe .
